name: Backend CI

on:
  pull_request:
    branches:
      - backend/go-migration
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

  push:
    branches:
      - backend/go-migration

jobs:
  go-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify dependencies
        run: go mod tidy

      - name: Download dependencies
        run: go mod download

      - name: Run formatting check
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v

      - name: Build backend
        run: go build ./...